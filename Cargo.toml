[package]
name = "mootui"
version = "0.3.1"
edition = "2021"
description = "TUI: import photos from a card or folder into a catalogued library, skipping duplicates"
license = "MIT"

[dependencies]
ratatui = "0.29"
walkdir = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
libc = "0.2"
unicode-normalization = "0.1"
